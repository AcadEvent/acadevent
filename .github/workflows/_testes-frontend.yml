name: Rodar Testes Frontend

on:
  workflow_call:
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'

jobs:
  testes-frontend:
    name: Executar Testes do Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do Frontend
        run: npm ci

      - name: Executar suite de testes do Frontend
        shell: bash
        run: |
          if npm run | grep -q "^  test$"; then
            npm test
          else
            echo "Nenhum teste configurado no frontend no momento (comportamento esperado)."
          fi
