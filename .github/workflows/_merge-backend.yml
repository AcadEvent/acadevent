name: Automerge Backend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-backend:
    name: Automerge Develop para Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar se ha arquivos do Frontend
        id: check_frontend
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --quiet origin +refs/heads/develop:refs/remotes/origin/develop || true
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main || true

          # Define a base de comparacao usando o merge-base com a main ou develop
          BASE_SHA=$(git merge-base origin/main origin/develop 2>/dev/null || git merge-base origin/develop HEAD 2>/dev/null || git rev-parse origin/develop~1)
          echo "Base de comparacao: $BASE_SHA"

          CHANGES=$(git diff --name-only "$BASE_SHA" origin/develop || true)

          if [ -z "$CHANGES" ]; then
            echo "✅ Nenhuma alteracao em relacao a base. Nada a validar."
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Arquivos alterados nesta promocao:"
          echo "$CHANGES" | sed 's/^/  /'

          FORBIDDEN=$(echo "$CHANGES" | grep -E "^frontend/" || true)

          if [ -n "$FORBIDDEN" ]; then
            echo "::notice::A branch 'backend' nao aceita alteracoes em 'frontend/'."
            echo "Arquivos recusados:"
            echo "$FORBIDDEN" | sed 's/^/  /'
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Validação de diretórios para backend concluída com sucesso (sem alterações em frontend/)."
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar Merge para Branch Backend
        if: steps.check_frontend.outputs.has_frontend == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse origin/backend >/dev/null 2>&1; then
            git checkout -B backend origin/backend
          else
            git checkout -b backend
          fi

          if git merge origin/develop -m "chore(merge): automerge develop into backend [skip ci]" --no-ff; then
            echo "Merge realizado com sucesso. Realizando push..."
            git push origin backend
          else
            echo "::error::Falha ao realizar merge da develop para backend."
            exit 1
          fi
