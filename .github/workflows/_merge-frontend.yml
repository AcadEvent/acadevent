name: Automerge Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-frontend:
    name: Automerge Develop para Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar se ha arquivos do Backend
        id: check_backend
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --quiet origin +refs/heads/develop:refs/remotes/origin/develop || true
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main || true

          # Define a base de comparacao usando o merge-base com a main ou develop
          BASE_SHA=$(git merge-base origin/main origin/develop 2>/dev/null || git merge-base origin/develop HEAD 2>/dev/null || git rev-parse origin/develop~1)
          echo "Base de comparacao: $BASE_SHA"

          CHANGES=$(git diff --name-only "$BASE_SHA" origin/develop || true)

          if [ -z "$CHANGES" ]; then
            echo "✅ Nenhuma alteracao em relacao a base. Nada a validar."
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Arquivos alterados nesta promocao:"
          echo "$CHANGES" | sed 's/^/  /'

          FORBIDDEN=$(echo "$CHANGES" | grep -E "^backend/" || true)

          if [ -n "$FORBIDDEN" ]; then
            echo "::notice::A branch 'frontend' nao aceita alteracoes em 'backend/'."
            echo "Arquivos recusados:"
            echo "$FORBIDDEN" | sed 's/^/  /'
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Validação de diretórios para frontend concluída com sucesso (sem alterações em backend/)."
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar Merge para Branch Frontend
        if: steps.check_backend.outputs.has_backend == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse origin/frontend >/dev/null 2>&1; then
            git checkout -B frontend origin/frontend
          else
            git checkout -b frontend
          fi

          if git merge origin/develop -m "chore(merge): automerge develop into frontend [skip ci]" --no-ff; then
            echo "Merge realizado com sucesso. Realizando push..."
            git push origin frontend
          else
            echo "::error::Falha ao realizar merge da develop para frontend."
            exit 1
          fi
