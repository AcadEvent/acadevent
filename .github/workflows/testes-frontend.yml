name: Rodar Testes Frontend

on:
  workflow_call:

  pull_request:
    branches: [dev]

  push:
    branches-ignore: [ main, dev ]

jobs:
  testes-frontend:
    name: Executar Testes do Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do Frontend
        run: npm ci

      - name: Executar suite de testes do Frontend
        run: npm run test:report

      - name: Publicar relatorio e cobertura do Frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-frontend
          path: |
            reports/frontend/
            reports/relatorio-testes-frontend.md
            reports/resumo-frontend.json
          if-no-files-found: warn
