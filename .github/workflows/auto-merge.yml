name: Sync Dev to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-branches:
    name: Syncing dev to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync main with dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Atualiza refs remotas sem escrever na branch checked-out.
          # Este workflow dispara em push na `dev`, então `git fetch origin dev:dev`
          # falha com "refusing to fetch into branch ... checked out".
          git fetch origin main
          git fetch origin

          git switch -C main origin/main
          git merge --ff-only origin/dev

          if git push origin main; then
            echo "main atualizada via fast-forward"
          else
            echo "Push direto bloqueado. Abrindo PR de sincronizacao..."
            gh pr create --base main --head dev --title "ci: sync dev to main" --body "Sincronização automática da dev para main" || true
            PR_NUMBER=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head "${GITHUB_REPOSITORY_OWNER}:dev" --state open --json number --jq '.[0].number')
            if [ -z "$PR_NUMBER" ]; then
              echo "Nao foi possivel encontrar o PR de sync"
              exit 1
            fi
            gh pr merge "$PR_NUMBER" --merge --auto
          fi
