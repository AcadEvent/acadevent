name: Sync Dev to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-branches:
    name: Syncing dev to main
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main with dev
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Garante que as branches remotas estão atualizadas localmente
          git fetch origin main:main
          git fetch origin dev:dev

          BEFORE_MAIN=$(git rev-parse main)
          echo "before_main=$BEFORE_MAIN" >> "$GITHUB_OUTPUT"

          # Tenta o merge rápido (fast-forward) de dev para main
          git checkout main
          git merge dev --ff-only

          # Pushes para main; se a branch main tiver proteção contra push direto, abre PR e realiza o merge automaticamente.
          # GITHUB_TOKEN não dispara outros workflows no push/merge da main, então o deploy é chamado abaixo via workflow_call.
          if ! git push origin main; then
            echo "Push direto bloqueado pelas regras de proteção da branch. Criando PR e realizando merge automático..."
            gh pr create --base main --head dev --title "ci: sync dev to main" --body "Sincronização automática da dev para main" || true
            gh pr merge dev --base main --merge --auto || gh pr merge dev --base main --admin --merge
            git fetch origin main:main
          fi

      - name: Detect changed paths for deploy
        id: changes
        run: |
          BEFORE_MAIN="${{ steps.sync.outputs.before_main }}"
          AFTER_MAIN=$(git rev-parse main)
          CHANGED=$(git diff --name-only "$BEFORE_MAIN" "$AFTER_MAIN" || true)
          echo "Files changed on main ($BEFORE_MAIN..$AFTER_MAIN):"
          echo "$CHANGED"

          BACKEND=false
          FRONTEND=false
          if printf '%s\n' "$CHANGED" | grep -qE '^(backend/|\.github/workflows/quaveone-deploy-backend\.yml$)'; then
            BACKEND=true
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(frontend/|\.github/workflows/quaveone-deploy-frontend\.yml$)'; then
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend from main
    needs: sync-branches
    if: needs.sync-branches.outputs.backend == 'true'
    uses: ./.github/workflows/quaveone-deploy-backend.yml
    secrets: inherit

  deploy-frontend:
    name: Deploy frontend from main
    needs: sync-branches
    if: needs.sync-branches.outputs.frontend == 'true'
    uses: ./.github/workflows/quaveone-deploy-frontend.yml
    secrets: inherit
