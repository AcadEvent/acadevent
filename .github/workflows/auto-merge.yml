name: Sync Dev to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-branches:
    name: Syncing dev to main
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync main with dev
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Atualiza refs remotas sem escrever na branch checked-out.
          # Este workflow dispara em push na `dev`, então `git fetch origin dev:dev`
          # falha com "refusing to fetch into branch ... checked out".
          git fetch origin main
          git fetch origin

          git switch -C main origin/main
          BEFORE_MAIN=$(git rev-parse HEAD)
          echo "before_main=$BEFORE_MAIN" >> "$GITHUB_OUTPUT"

          git merge --ff-only origin/dev

          if git push origin main; then
            echo "main atualizada via fast-forward"
          else
            echo "Push direto bloqueado. Abrindo PR de sincronizacao..."
            gh pr create --base main --head dev --title "ci: sync dev to main" --body "Sincronização automática da dev para main" || true
            PR_NUMBER=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head "${GITHUB_REPOSITORY_OWNER}:dev" --state open --json number --jq '.[0].number')
            if [ -z "$PR_NUMBER" ]; then
              echo "Nao foi possivel encontrar o PR de sync"
              exit 1
            fi
            gh pr merge "$PR_NUMBER" --merge --auto
            git fetch origin main
          fi

      - name: Detect changed paths for deploy
        id: changes
        run: |
          BEFORE_MAIN="${{ steps.sync.outputs.before_main }}"
          AFTER_MAIN=$(git rev-parse main)
          CHANGED=$(git diff --name-only "$BEFORE_MAIN" "$AFTER_MAIN" || true)
          echo "Files changed on main ($BEFORE_MAIN..$AFTER_MAIN):"
          echo "$CHANGED"

          BACKEND=false
          FRONTEND=false
          if printf '%s\n' "$CHANGED" | grep -qE '^(backend/|\.github/workflows/quaveone-deploy-backend\.yml$)'; then
            BACKEND=true
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(frontend/|\.github/workflows/quaveone-deploy-frontend\.yml$)'; then
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend from main
    needs: sync-branches
    if: needs.sync-branches.outputs.backend == 'true'
    uses: ./.github/workflows/quaveone-deploy-backend.yml
    secrets: inherit

  deploy-frontend:
    name: Deploy frontend from main
    needs: sync-branches
    if: needs.sync-branches.outputs.frontend == 'true'
    uses: ./.github/workflows/quaveone-deploy-frontend.yml
    secrets: inherit
