name: Rodar Testes Backend

on:
  workflow_call:

  pull_request:
    branches: [dev]

  push:
    branches-ignore: [ main, dev ]

jobs:
  testes-backend:
    name: Executar Testes do Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do Backend
        run: npm ci

      - name: Gerar Prisma Client
        env:
          # generate nao conecta; a URL precisa existir porque o prisma.config.ts exige
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Executar suite de testes do Backend
        run: npm run test:report

      - name: Validar gerador de relatorios
        run: node --test ../scripts/test-report.test.cjs

      - name: Publicar relatorio e cobertura do Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-backend
          path: |
            reports/backend/
            reports/relatorio-testes-backend.md
            reports/resumo-backend.json
          if-no-files-found: warn
